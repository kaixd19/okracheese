<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive viewport -->
    <title>Okra Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Initial Play Screen */
        #play-screen {
            display: none;
            text-align: center;
        }

        #play-button {
            padding: 20px 40px;
            font-size: 2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #top-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            /* Stack items vertically */
            align-items: center;
            /* Center items horizontally */
            padding: 10px 0;
            background-color: rgba(255, 255, 255, 0.8);
        }

        #back-button,
        #shop-button {
            padding: 6px 12px;
            /* Even smaller padding */
            font-size: 0.9em;
            /* Even smaller font */
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 6px;
            /* Adjust top position */
        }

        /* Adjustments for shop button */
        #shop-button {
            right: 6px;
            /* Adjust right position */
            left: auto;
            /* Override potential left alignment */
        }

        /* Adjustments for back button */
        #back-button {
            left: 6px;
            /* Adjust left position */
            right: auto;
            /* Override potential right alignment */
        }

        #currency {
            font-size: 1.5em;
            color: #333;
            text-align: center;
            /* Center the text */
            margin: 5px 0;
            /* Add some spacing */
        }

        #game-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 400px;
            background-color: #F0E68C;
            overflow: hidden;
            display: none;
            cursor: pointer;
            /* Tapping action */
        }

        #plant {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: #008000;
            /* Initial color */
        }

        .water,
        .fertilizer {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 30px;
            background-color: #8B4513;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        #shop {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            height: 300px;
            background-color: rgba(144, 238, 144, 0.8);
            border: 1px solid black;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        #shop-close {
            position: absolute;
            top: 5px;
            right: 5px;
            cursor: pointer;
        }

        #game-select {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid black;
            text-align: center;
        }

        #game-select button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Dino Okra Jump Styles */
        #dino-game-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            height: 50vh;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            /* Add touch-action: none; to prevent scrolling issues */
            touch-action: none;
        }

        #dino {
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 30px;
            height: 30px;
            background-color: green;
        }

        .obstacle {
            position: absolute;
            bottom: 0;
            width: 5%;
            height: 30px;
            background-color: #8B4513;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        #dino-game-container #back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #score,
        #high-score {
            position: absolute;
            top: 10px;
            /* Adjust as needed */
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            /* Corrected to em */
            color: #333;
            text-align: center;
            /* Ensure text is centered */
        }

        #high-score {
            top: 30px;
        }

        #pause-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Plant Growth Styles */
        .seed {
            width: 20px;
            height: 20px;
            background-color: brown;
            border-radius: 50%;
        }

        .sprout {
            width: 30px;
            height: 40px;
            background-color: green;
        }

        .small-plant {
            width: 40px;
            height: 60px;
            background-color: green;
        }

        .mature-plant {
            width: 60px;
            height: 80px;
            background-color: darkgreen;
        }

        #tap-to-start {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            color: #333;
            cursor: pointer;
        }

        #game-over-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            /* Reduced size */
            color: red;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #game-over-message button {
            margin-top: 5px;
            /* Further reduced margin */
            padding: 5px 10px;
            /* Further reduced padding */
            font-size: 0.8em;
            /* Further reduced font size */
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Initial Play Screen -->
    <div id="play-screen">
        <h1>Okra Games</h1>
    </div>

    <!-- Game Selection Screen -->
    <div id="game-select">
        <h2>Select a Game</h2>
        <button onclick="loadGrowGame()">Grow Okra Plant</button>
        <button onclick="loadJumpGame()">Okra Jump Game</button>
    </div>

    <!-- Grow Okra Game Elements -->
    <div id="game-container">
        <button id="back-button" onclick="showGameSelect()">Back</button>
        <button id="shop-button" onclick="openShop()">Shop</button>
        <div id="top-bar">
            <div id="currency">Okra Coins: <span id="currency-value">0</span></div>
            <div id="level">Level: <span id="level-value">1</span></div>
            <div id="taps">Water: <span id="taps-value">0</span></div>
            <div id="taps-needed">Water Needed: <span id="taps-needed-value">100</span></div>
        </div>
        <div id="plant"></div>
    </div>

    <div id="shop">
        <span id="shop-close" onclick="closeShop()">X</span>
        <h2>Shop</h2>
        <p>Water: 10 Okra Coins (10 Taps)</p>
        <button onclick="buyItem('water')">Buy Water</button>
        <p>Fertilizer: 20 Okra Coins</p>
        <button onclick="buyItem('fertilizer')">Buy Fertilizer</button>
    </div>

    <!-- Dino Okra Jump Game Elements -->
    <div id="dino-game-container">
        <button id="back-button" onclick="showGameSelect()">Back</button>
        <button id="pause-button" onclick="togglePause()">Pause</button>
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="high-score">High Score: <span id="high-score-value">0</span></div>
        <div id="dino"></div>
        <div id="tap-to-start">Tap to Start</div>
        <div id="game-over-message">
            Game Over! Your score: <span id="final-score">0</span>
            <button id="play-again-button">Play Again</button>
        </div>
    </div>

    <script>
        // JavaScript code will be added here
        const playScreen = document.getElementById('play-screen');
        const gameSelect = document.getElementById('game-select');

        const plant = document.getElementById('plant');
        const gameContainer = document.getElementById('game-container');
        const currencyDisplay = document.getElementById('currency-value');
        const shop = document.getElementById('shop');

        //Plant Grow Game Elements
        const levelDisplay = document.getElementById('level-value');
        const tapsDisplay = document.getElementById('taps-value');
        const tapsNeededDisplay = document.getElementById('taps-needed-value');

        //Dino Okra Jump Elements
        const dino = document.getElementById('dino');
        const dinoGameContainer = document.getElementById('dino-game-container');
        const highScoreDisplay = document.getElementById('high-score-value');
        const pauseButton = document.getElementById('pause-button');
        const tapToStart = document.getElementById('tap-to-start');
        const gameOverMessage = document.getElementById('game-over-message');
        const playAgainButton = document.getElementById('play-again-button');
        const finalScoreDisplay = document.getElementById('final-score');
        const scoreDisplay = document.getElementById('score-value');

        let isJumping = false;
        let position = 0;
        let score = 0;
        let gameInterval;
        let obstacleInterval;
        let isPaused = false;
        let gameStarted = false;
        let highScore = localStorage.getItem('highScore') || 0;
        let currency = 0; // Initialize currency
        let isPausedJump = false; // Track pause state for Jump Game

        let tapsPerWater = 10; //Fixed Taps per water

        //Plant Growth Values
        let plantLevel = 1;
        let taps = 0;
        let tapsNeeded = plantLevel * 100; // 100, 200, 300, 400

        //Plant Growth Visuals
        const plantStages = {
            1: 'seed',
            2: 'sprout',
            3: 'small-plant',
            4: 'mature-plant',
            5: 'voucher'
        };

        const voucherCodes = [
            "1234", "5678", "9012", "3456", "7890",
            "2468", "1357", "8642", "9753", "1098"
        ];

        //Functions

        function goBack() {
            window.location.href = "index.html";
        }

        function openShop() {
            shop.style.display = 'block';
        }

        function closeShop() {
            shop.style.display = 'none';
        }

        function buyItem(item) {
            if (item === 'water') {
                if (currency >= 10) {
                    currency -= 10;
                    applyTaps(tapsPerWater); // Buy water and get taps
                    updateCurrencyDisplay(); // Update display after purchase
                } else {
                    alert("Not enough Okra Coins!");
                }
            } else if (item === 'fertilizer') {
                if (currency >= 20) {
                    currency -= 20;
                    // You can add a fertilizer effect here, e.g., reduce water needed
                    alert("Fertilizer used! (No effect yet)");
                    updateCurrencyDisplay(); // Update display after purchase
                } else {
                    alert("Not enough Okra Coins!");
                }
            }
        }

        function applyTaps(amount) {
            taps += amount;
            if (taps >= tapsNeeded) {
                levelUp();
            } else {
                updateDisplay();
            }
        }

        function levelUp() {
            plantLevel++;
            taps = 0; // Reset taps
            tapsNeeded = plantLevel * 100; // 100, 200, 300, 400

            if (plantLevel <= 5) {
                updatePlantAppearance(); // Update plant appearance based on level
            } else {
                //Display Voucher
                const voucherIndex = Math.floor(Math.random() * voucherCodes.length);
                const voucherCode = voucherCodes[voucherIndex];
                alert("Congratulations! You've earned a voucher code: " + voucherCode);
            }

            updateDisplay();
        }

        function updatePlantAppearance() {
            const stage = plantStages[plantLevel];
            plant.className = ''; // Clear existing classes
            plant.classList.add(stage); // Add the new class
        }

        function updateDisplay() {
            levelDisplay.textContent = plantLevel;
            tapsDisplay.textContent = taps;
            tapsNeededDisplay.textContent = tapsNeeded;
            currencyDisplay.textContent = currency;
        }

        function updateCurrencyDisplay() {
            currencyDisplay.textContent = currency;
        }

        function increaseCurrency() {
            currency += 1;
            updateCurrencyDisplay();
        }

        // Game Selection
        function showGameSelect() {
            gameContainer.style.display = 'none';
            dinoGameContainer.style.display = 'none';
            shop.style.display = 'none';
            playScreen.style.display = 'none';
            gameSelect.style.display = 'block';
        }

        function loadGrowGame() {
            gameSelect.style.display = 'none';
            gameContainer.style.display = 'flex'; // Make Top Bar appear
            shop.style.display = 'none';
            dinoGameContainer.style.display = "none"; // Hide Dino Okra Jump

            //Set the inital appearance
            plant.classList.add('seed'); // Start as a seed
            updateDisplay();
            isPaused = true; //Pause
            updateCurrencyDisplay(); // Initial display of currency

            // Attach event listener for earning coins
            gameContainer.addEventListener('touchstart', increaseCurrency);
        }

        function loadJumpGame() {
            gameSelect.style.display = 'none';
            gameContainer.style.display = 'none'; // Hide growing plant
            shop.style.display = 'none';
            dinoGameContainer.style.display = 'flex'; // Show Dino Okra Jump Screen

            // Remove event listener from Grow Okra Plant
            gameContainer.removeEventListener('touchstart', increaseCurrency);

            //Start Dino Okra Jump
            startJumpGame();
        }

        /* ------------------------------------------------------- */
        /* ---------------- DINO OKRA JUMP ----------------------- */
        /* ------------------------------------------------------- */

        /* ----------------  FUNCTION FOR OKRA JUMP--------------- */
        /* ------------------------------------------------------- */

        function jump() {
            if (isJumping) return;
            isJumping = true;

            let upInterval = setInterval(() => {
                if (position >= 150) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        }
                        position -= 10;
                        dino.style.bottom = position + 'px';
                    }, 20);
                }
                position += 10;
                dino.style.bottom = position + 'px';
            }, 20);
        }

        function generateObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            let obstaclePosition = dinoGameContainer.offsetWidth + 100; // Adjusted start position
            let randomTime = Math.random() * 4000 + 2000;

            obstacle.style.left = obstaclePosition + 'px';
            dinoGameContainer.appendChild(obstacle); // Add to dino game container

            let leftInterval = setInterval(() => {
                if (isPausedJump || !gameStarted) return; // Do nothing if game is paused or not started

                if (obstaclePosition > 0 && obstaclePosition < 50 && position < 50) {
                    // Game Over
                    clearInterval(leftInterval);
                    gameOver();
                }

                obstaclePosition -= 10;
                obstacle.style.left = obstaclePosition + 'px';
            }, 20);

            setTimeout(() => {
                if (!isPausedJump && gameStarted) {
                    generateObstacle();
                }
            }, randomTime);
        }

        function startGame() {
            //Reset everything
            isPausedJump = false;
            isJumping = false;
            position = 0;
            gameStarted = true;

            highScoreDisplay.textContent = highScore; // Display initial high score
            score = 0;
            updateScoreDisplay();

            obstacleInterval = setInterval(generateObstacle, 2000);

            gameInterval = setInterval(() => {
                if (!isPausedJump) { // Only increase score if not paused
                    score++;
                    updateScoreDisplay();
                }
            }, 100);
        }

        function pauseGame() {
            isPausedJump = true; //Pause
            pauseButton.textContent = "Resume"; //Change the button
            clearInterval(gameInterval); // Stop score increase
        }

        function resumeGame() {
            isPausedJump = false; //resume
            pauseButton.textContent = "Pause"; // Change the button
            generateObstacle(); //Restart
            gameInterval = setInterval(() => { // Resume score increase
                if (!isPausedJump) {
                    score++;
                    updateScoreDisplay();
                }
            }, 100);
        }

        function togglePause() {
            if (isPausedJump) {
                resumeGame();
            } else {
                pauseGame();
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            gameStarted = false; // Set gameStarted to false

            // Update high score if necessary
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
                highScoreDisplay.textContent = highScore;
            }

            //Show play again message
            finalScoreDisplay.textContent = score;
            gameOverMessage.style.display = 'flex';
            // Show the game over message
            gameOverMessage.style.display = 'flex';
        }

        function startJumpGame() {
            //Initial variables
            highScoreDisplay.textContent = highScore;
            isPausedJump = false;
            isJumping = false;
            position = 0;
            gameStarted = false;

            // Set button Text
            pauseButton.textContent = "Pause";

            // Show high score
            highScoreDisplay.textContent = highScore;

            document.getElementById('tap-to-start').style.display = 'block';
            document.getElementById('game-over-message').style.display = 'none';

            // Event handler for Play Again button
            playAgainButton.onclick = function () {
                resetGame();
            };

            dinoGameContainer.addEventListener('touchstart', startGameHandler);
        }

        function showGameSelect() {
            gameContainer.style.display = 'none';
            dinoGameContainer.style.display = 'none';
            shop.style.display = 'none';
            playScreen.style.display = 'none';
            gameSelect.style.display = 'block';
        }

        function startGameHandler() {
            if (!gameStarted) {
                startGame();
                tapToStart.style.display = 'none'; // Hide "Tap to Start"
                gameOverMessage.style.display = 'none'; //Hide game over message

                //Dino tap
                dinoGameContainer.addEventListener('touchstart', jump); //Start the jump
            }
        }

        function resetGame() {
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            gameStarted = false;
            score = 0; // Reset score
            position = 0; // Reset dino position
            dino.style.bottom = '0px'; // Ensure dino is at the base
            updateScoreDisplay(); // Update the score display

            // Remove existing obstacles
            const obstacles = document.querySelectorAll('.obstacle');
            obstacles.forEach(obstacle => obstacle.remove());

            // Hide the game over message
            gameOverMessage.style.display = 'none';

            // Restart the game
            startJumpGame();
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = score;
            finalScoreDisplay.textContent = score;
        }

        showGameSelect();
        playScreen.style.display = "block";

        //List of Used Voucher Codes
        const usedVoucherCodes = [
            "1234", "5678", "9012", "3456", "7890",
            "2468", "1357", "8642", "9753", "1098"
        ];
    </script>
</body>

</html>
