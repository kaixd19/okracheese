<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1>Cheese-Filled Okra</h1>
            </div>
        </div>
    </header>

    <section id="login-container">
        <h2>Login</h2>
        <form id="login-form" onsubmit="handleLogin(event); return false;">
            <input type="email" id="login-email" placeholder="Enter Email" required>
            <div id="verification-question"></div>
            <input type="text" id="verification-answer" placeholder="Enter Answer" required>
            <button class="button_1" type="submit">Login</button>
        </form>
        <p id="login-error" class="error-message"></p>
    </section>

    <script>
        let correctAnswer;

        function generateVerificationQuestion() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            const operation = Math.random() < 0.5 ? '+' : '-';
            let answer;

            if (operation === '+') {
                answer = num1 + num2;
            } else {
                answer = num1 - num2;
            }

            document.getElementById('verification-question').textContent = `What is ${num1} ${operation} ${num2}?`;
            correctAnswer = answer.toString();
            return correctAnswer;
        }

        generateVerificationQuestion();

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('login-email').value;
            const answer = document.getElementById('verification-answer').value;
            const errorMessage = document.getElementById('login-error');

            if (answer === correctAnswer) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "index.html";
                errorMessage.textContent = '';
            } else {
                errorMessage.textContent = 'Incorrect answer. Please try again.';
                generateVerificationQuestion();
                document.getElementById('verification-answer').value = '';
            }
        }
    </script>
</body>

</html>
